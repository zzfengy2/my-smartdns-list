name: Auto Convert SmartDNS List

on:
  schedule:
    - cron: '0 20 * * *' # 每天北京时间凌晨 4 点运行
  workflow_dispatch:      # 允许手动触发

# 关键修复：显式声明写权限，防止 exit code 128 (Permission Denied)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # 关键修复：使用官方 Action 拉取源码，比手动 git clone 更稳定
      - name: Clone Source
        uses: actions/checkout@v4
        with:
          repository: felixonmars/dnsmasq-china-list
          path: source
          fetch-depth: 1

      - name: Run Build
        run: |
          cd source
          make smartdns SERVER=cn
          # 确保文件被复制到根目录
          cp *.smartdns.conf ../
          cd ..
          # 删除 source 目录，防止提交时产生冲突
          rm -rf source

      - name: Commit and Push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          # 即使没有更新也不要报错
          git commit -m "Update SmartDNS lists $(date +%Y-%m-%d)" || exit 0
          git push
