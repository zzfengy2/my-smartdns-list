name: Auto Convert SmartDNS List

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartdns-list-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout upstream data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: felixonmars/dnsmasq-china-list
          path: _upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Build and validate lists
        run: |
          ./scripts/build.sh _upstream .
          ./scripts/validate.sh .

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- \
            accelerated-domains.china.smartdns.conf \
            apple.china.smartdns.conf \
            google.china.smartdns.conf \
            bogus-nxdomain.china.smartdns.conf \
            proxy-domains.smartdns.conf

          if git diff --cached --quiet; then
            echo "No list changes to commit."
            exit 0
          fi

          git commit -m "Update SmartDNS lists and proxy rules $(date +%Y-%m-%d)"
          git push
