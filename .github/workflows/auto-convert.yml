name: Auto Convert SmartDNS List

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Foreign Servers File
        run: |
          # 创建国外服务器配置文件
          cat <<EOF > foreign-servers.smartdns.conf
          # Cloudflare
          server 1.0.0.1 -group gw -exclude-default-group
          server 1.1.1.1 -group gw -exclude-default-group
          server-https https://cloudflare-dns.com/dns-query -group gw -exclude-default-group
          server 2606:4700:4700::1111 -group gw -exclude-default-group
          server 2606:4700:4700::1001 -group gw -exclude-default-group

          # 谷歌 (Google)
          server 8.8.8.8 -group gw -exclude-default-group
          server 8.8.4.4 -group gw -exclude-default-group
          server-https https://dns.google/dns-query -group gw -exclude-default-group
          server-https https://dns64.google/dns-query -group gw -exclude-default-group
          server-tls dns.google -group gw -exclude-default-group
          server 2001:4860:4860::8888 -group gw -exclude-default-group
          server 2001:4860:4860::8844 -group gw -exclude-default-group

          # 微软 (Level 3)
          server 4.2.2.2 -group gw -exclude-default-group
          server 4.2.2.5 -group gw -exclude-default-group

          # Neustar UltraDNS
          server 64.6.64.6 -group gw -exclude-default-group
          server 64.6.65.6 -group gw -exclude-default-group
          server 2620:74:1b::1:1 -group gw -exclude-default-group
          server 2620:74:1c::2:2 -group gw -exclude-default-group
          EOF

      - name: Clone Source and Build
        run: |
          git clone https://github.com/felixonmars/dnsmasq-china-list.git source
          cd source
          make smartdns SERVER=cn
          cp *.smartdns.conf ../
          cd ..
          rm -rf source

      - name: Commit and Push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update SmartDNS lists and servers $(date +%Y-%m-%d)" || exit 0
          git push
