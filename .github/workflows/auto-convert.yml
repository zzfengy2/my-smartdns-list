name: Auto Convert SmartDNS List

on:
  schedule:
    - cron: '0 20 * * *' # 每天凌晨 4 点(北京时间)自动运行
  workflow_dispatch:      # 允许你手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v3

      - name: Clone Source
        uses: actions/checkout@v4
        with:
          repository: felixonmars/dnsmasq-china-list
          path: source
          fetch-depth: 1 # 只拉取最新的一次提交，极大加快速度并防止挂起

      - name: Run Make SmartDNS
        run: |
          cd source
          # 执行你要求的指令，将组名设为 cn
          make smartdns SERVER=cn
          # 将生成的 .conf 文件移动到你的仓库根目录
          cp *.smartdns.conf ../
          cd ..

      - name: Commit and Push
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git commit -m "Update SmartDNS lists $(date +%Y-%m-%d)" || exit 0
          git push
